name: Build iOS IPA (OutfitOracle)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          CURRENT_XCODE=$(xcodebuild -version | head -n 1)
          if [[ "$CURRENT_XCODE" == *"Xcode 15"* ]]; then
            echo "Xcode 15 detected, adjusting objectVersion to 56..."
            sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/' OutfitOracle.xcodeproj/project.pbxproj
          fi
          head -n 12 OutfitOracle.xcodeproj/project.pbxproj

      - name: Build iOS App (Unsigned for Sideloadly / AltStore / TrollStore)
        run: |
          xcodebuild -project OutfitOracle.xcodeproj \
            -scheme OutfitOracle \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/OutfitOracle.app Payload/
          zip -r OutfitOracle.ipa Payload
          ls -lh OutfitOracle.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutfitOracle-iOS-IPA
          path: OutfitOracle.ipa
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OutfitOracle.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
