name: OutfitOracle
options:
  bundleIdPrefix: com.outfitoracle
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"

targets:
  OutfitOracle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Core
      - path: Features
      - path: OutfitOracleApp.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: OutfitOracle
        PRODUCT_BUNDLE_IDENTIFIER: com.outfitoracle.app
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
